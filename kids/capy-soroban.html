<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Soroban Friends">
<meta name="theme-color" content="#fff4dc">
<title>Soroban Friends</title>
<style>
:root {
  --bg: #fff4dc; --card: #ffffff; --ink: #3b2a1a; --muted: #8a7258;
  --brand: #3aa17e; --brand-dark: #2b7f61; --edge: #e6d2a8; --dot: #ead9b6; --gold: #f5b82e; --bad: #d9534f;
  --earth: #f08a24; --earth-off: #ecd3b0; --heaven: #e04f5f; --heaven-off: #f1c3c8;
  --frame: #8a5a33; --rod: #5a3a1e;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); transition: background .3s; color: var(--ink); overflow: hidden; overscroll-behavior: none;
  font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#app { height: 100%; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; }
button:focus-visible { outline: 4px solid var(--gold); outline-offset: 2px; }

/* ---------- home ---------- */
.home { flex: 1; overflow-y: auto; padding: 20px 28px 40px; }
.hero { display: flex; align-items: center; gap: 18px; margin-bottom: 8px; }
.hero .capy { width: 150px; flex: none; }
.hero h1 { margin: 0; font-size: 40px; line-height: 1.1; }
.hero p { margin: 6px 0 0; color: var(--muted); font-size: 20px; }
.module { margin-top: 26px; }
.module h2 { font-size: 24px; margin: 0 0 12px; display: flex; align-items: center; gap: 10px; }
.module h2 .num { background: var(--brand); color: #fff; border-radius: 50%; width: 38px; height: 38px; display: grid; place-items: center; font-size: 22px; }
.path { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
.card {
  background: var(--card); border-radius: 26px; padding: 18px 12px 14px; min-height: 170px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 5px 0 var(--edge); transition: transform .1s;
}
.card:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 var(--edge); }
.card .icon { font-size: 54px; line-height: 1; }
.card .name { font-size: 18px; font-weight: 700; text-align: center; }
.card .stars { font-size: 26px; letter-spacing: 2px; min-height: 30px; }
.card.next { outline: 5px solid var(--gold); }
.card:disabled { opacity: .45; cursor: default; box-shadow: none; }

/* ---------- lesson ---------- */
.lesson { flex: 1; display: flex; flex-direction: column; padding: 10px 22px 16px; min-height: 0; }
.top { display: flex; align-items: center; gap: 14px; }
.round { width: 64px; height: 64px; border-radius: 50%; background: var(--card); font-size: 30px; box-shadow: 0 4px 0 var(--edge); flex: none; }
.dots { flex: 1; display: flex; gap: 8px; justify-content: center; }
.dots i { width: 16px; height: 16px; border-radius: 50%; background: var(--dot); }
.dots i.done { background: var(--brand); }
.dots i.now { background: var(--gold); transform: scale(1.35); }
.stage { flex: 1; display: grid; grid-template-columns: minmax(150px, 22%) 1fr; gap: 20px; align-items: center; min-height: 0; }
.coach { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.coach .capy { width: 100%; max-width: 210px; }
.bubble { background: var(--card); border-radius: 24px; padding: 12px 22px; font-size: 64px; font-weight: 800; min-width: 110px; text-align: center; box-shadow: 0 4px 0 var(--edge); line-height: 1.1; }
.bubble.sm { font-size: 40px; }
.bubble .delta { display: block; font-size: 22px; color: var(--brand-dark); }
.work { display: flex; flex-direction: column; align-items: center; gap: 14px; height: 100%; min-height: 0; justify-content: center; }
.board { width: 100%; flex: 1; min-height: 0; display: flex; justify-content: center; }
.board svg { height: 100%; max-width: 100%; touch-action: none; }
.actions { display: flex; gap: 16px; justify-content: center; min-height: 84px; width: 100%; }
.big { background: var(--brand); color: #fff; font-size: 34px; font-weight: 800; border-radius: 30px; padding: 12px 56px; min-height: 80px; box-shadow: 0 6px 0 var(--brand-dark); }
.big:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--brand-dark); }
.big.alt { background: var(--card); color: var(--ink); box-shadow: 0 6px 0 var(--edge); }
.choice { background: var(--card); font-size: 52px; font-weight: 800; border-radius: 28px; min-width: 130px; min-height: 90px; box-shadow: 0 6px 0 var(--edge); }
.choice.pulse { animation: glow 1s ease-in-out infinite; }
.choice.gone { opacity: .25; pointer-events: none; }
.choice.right { background: #c9f0d8; }

/* ---------- soroban ---------- */
.soroban .frame { fill: var(--frame); }
.soroban .rod { stroke: var(--rod); stroke-width: 6; stroke-linecap: round; }
.soroban .bar { fill: #5a3a1e; }
.soroban .rod-label { fill: var(--ink); font-size: 30px; font-weight: 800; }
.soroban .bead { cursor: grab; touch-action: none; transition: transform .18s cubic-bezier(.3,.7,.3,1); }
.soroban .bead.drag { cursor: grabbing; transition: none; }
.soroban .bead .shape { stroke: rgba(0,0,0,.25); stroke-width: 3; transition: fill .15s; }
.soroban .bead .shine { fill: rgba(255,255,255,.45); }
.soroban .part-earth .shape { fill: var(--earth-off); }
.soroban .part-earth.on .shape { fill: var(--earth); }
.soroban .part-heaven .shape { fill: var(--heaven-off); }
.soroban .part-heaven.on .shape { fill: var(--heaven); }
.soroban .ghost { fill: rgba(255,255,255,.18); stroke: #fff; stroke-width: 6; stroke-dasharray: 12 9; pointer-events: none; }
@keyframes glow { 50% { filter: drop-shadow(0 0 12px #ffd400) drop-shadow(0 0 6px #ffd400); } }

/* ---------- capybara ---------- */
.capy { display: block; }
.capy .m-happy, .capy .m-oops, .capy .blush { display: none; }
.capy.happy .m-happy, .capy.happy .blush { display: inline; }
.capy.oops .m-oops { display: inline; }
.capy.happy { animation: hop .5s ease 2; }
.capy:not(.happy):not(.oops) .m-happy { display: inline; }
@keyframes hop { 40% { transform: translateY(-16px); } }

/* ---------- result ---------- */
.result { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.result .capy { width: 240px; }
.result h1 { margin: 0; font-size: 44px; }
.result .stars { font-size: 76px; letter-spacing: 8px; }
.result .row { display: flex; gap: 18px; margin-top: 8px; }

/* ---------- parent ---------- */
.gear { position: fixed; right: 10px; bottom: 10px; width: 44px; height: 44px; border-radius: 50%; background: transparent; opacity: .35; font-size: 22px; }
.overlay { position: fixed; inset: 0; background: rgba(40, 25, 10, .55); display: grid; place-items: center; z-index: 10; }
.overlay[hidden] { display: none; }
.panel { background: var(--card); border-radius: 26px; padding: 24px 28px; width: min(640px, 92vw); max-height: 88vh; overflow-y: auto; }
.panel h2 { margin: 0 0 4px; }
.panel p { color: var(--muted); margin: 0 0 14px; }
.panel table { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
.panel td, .panel th { text-align: left; padding: 7px 6px; border-bottom: 1px solid #eee2c8; font-size: 16px; }
.panel .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.pbtn { background: #f3e8cf; border-radius: 14px; padding: 12px 18px; font-size: 16px; font-weight: 700; }
.pbtn.danger { color: var(--bad); }
.pbtn.danger.armed { background: var(--bad); color: #fff; }
.pbtn.go { background: var(--brand); color: #fff; }
.voice { display: flex; align-items: center; gap: 10px; margin: 6px 0 4px; }
.voice label { font-weight: 700; }
.voice select { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 10px; border-radius: 12px; border: 2px solid #eee2c8; background: #fff; }
.panel .tip { font-size: 14px; margin: 0 0 10px; }

@media (max-width: 700px), (max-height: 520px) {
  .bubble { font-size: 44px; } .big { font-size: 26px; padding: 8px 36px; min-height: 64px; }
  .hero .capy { width: 100px; } .hero h1 { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) {
  .capy.happy, .choice.pulse { animation: none; }
  .soroban .bead { transition: none; }
}

</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<div id="parent" class="overlay" hidden></div>
<script>
// Soroban engine: pure bead logic (shared with tests) plus an SVG renderer.
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.Soroban = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ---------- pure logic: one rod holds a digit 0-9 ----------
  const beadsFor = d => ({ heaven: d >= 5, earth: d % 5 });
  const digitFrom = ({ heaven, earth }) => (heaven ? 5 : 0) + earth;
  // Earth bead 0 is the one nearest the bar.
  const isActive = (d, kind, i) => (kind === 'heaven' ? d >= 5 : i < d % 5);
  // Push a bead toward (true) or away from (false) the bar. Earth beads move as a stack.
  function move(d, kind, i, toward) {
    const { heaven, earth } = beadsFor(d);
    if (kind === 'heaven') return digitFrom({ heaven: toward, earth });
    return digitFrom({ heaven, earth: toward ? Math.max(earth, i + 1) : Math.min(earth, i) });
  }
  const tap = (d, kind, i) => move(d, kind, i, !isActive(d, kind, i));
  const toValue = digits => digits.reduce((a, d) => a * 10 + d, 0);
  const toDigits = (n, rods) => String(n).padStart(rods, '0').slice(-rods).split('').map(Number);

  // ---------- geometry (SVG units) ----------
  const G = { rodW: 120, pad: 14, labelH: 34, bar: 140, barH: 12, bw: 88, bh: 54, pitch: 58 };
  G.deckEnd = G.bar + G.barH + 5 * G.pitch;
  G.H = G.deckEnd + 10;
  const heavenY = on => (on ? G.bar - G.bh - 3 : G.bar - G.bh - G.pitch);
  const earthY = (i, on) => (on ? G.bar + G.barH + 3 + i * G.pitch : G.deckEnd - G.bh - (3 - i) * G.pitch);
  // The two resting heights of a bead: against the bar (on) and away from it (off).
  const bounds = (kind, i) => (kind === 'heaven'
    ? { on: heavenY(true), off: heavenY(false) }
    : { on: earthY(i, true), off: earthY(i, false) });

  // A bead dragged to height y (top edge). It cannot leave its track, and it settles
  // on whichever end is nearer. `digit` is the rod's value if it were released there.
  function drag(d0, kind, i, y) {
    const { on, off } = bounds(kind, i);
    const cy = Math.min(Math.max(y, Math.min(on, off)), Math.max(on, off));
    const toward = Math.abs(cy - on) < Math.abs(cy - off);
    return { y: cy, toward, digit: move(d0, kind, i, toward) };
  }

  // ---------- SVG renderer ----------
  const NS = 'http://www.w3.org/2000/svg';
  const TAP_PX = 8; // movement under this many screen pixels counts as a tap

  function el(tag, attrs, parent) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }

  // opts: { rods, labels, onChange(digits) }. onChange fires when a finger lifts and the
  // rods hold a different value than before it touched down.
  function create(host, opts = {}) {
    const rods = opts.rods || 1;
    const digits = Array(rods).fill(0);
    let locked = false;
    const W = rods * G.rodW + 2 * G.pad;

    const svg = el('svg', { viewBox: `0 0 ${W} ${G.labelH + G.H + 2 * G.pad}`, class: 'soroban' });
    el('rect', { x: 0, y: G.labelH, width: W, height: G.H + 2 * G.pad, rx: 22, class: 'frame' }, svg);
    const board = el('g', { transform: `translate(${G.pad},${G.labelH + G.pad})` }, svg);

    const centerX = r => r * G.rodW + G.rodW / 2;
    for (let r = 0; r < rods; r++) {
      el('line', { x1: centerX(r), x2: centerX(r), y1: 0, y2: G.H, class: 'rod' }, board);
      if (opts.labels) {
        const t = el('text', { x: G.pad + centerX(r), y: G.labelH - 10, class: 'rod-label', 'text-anchor': 'middle' }, svg);
        t.textContent = opts.labels[r];
      }
    }
    el('rect', { x: 0, y: G.bar, width: rods * G.rodW, height: G.barH, class: 'bar' }, board);

    const bead = kind => {
      const g = el('g', { class: `bead part-${kind}` }, board);
      el('ellipse', { rx: G.bw / 2, ry: G.bh / 2, class: 'shape' }, g);
      el('ellipse', { cx: -14, cy: -11, rx: 18, ry: 7, class: 'shine' }, g);
      return g;
    };
    const refs = [];
    for (let r = 0; r < rods; r++) {
      refs.push({ heaven: bead('heaven'), earth: [0, 1, 2, 3].map(() => bead('earth')) });
    }

    const place = (g, cx, y, on) => {
      g.style.transform = `translate(${cx}px,${y + G.bh / 2}px)`;
      g.classList.toggle('on', on);
    };
    // `skip` is the bead under a finger; it is positioned by the drag, not by its digit.
    const layout = skip => digits.forEach((d, r) => {
      const cx = centerX(r);
      if (refs[r].heaven !== skip) place(refs[r].heaven, cx, heavenY(d >= 5), d >= 5);
      refs[r].earth.forEach((g, i) => { if (g !== skip) place(g, cx, earthY(i, i < d % 5), i < d % 5); });
    });
    const scale = () => {
      const b = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
      return Math.min(b.width / vb.width, b.height / vb.height) || 1;
    };

    // The bead follows the finger along its track and pushes the beads it touches, like a
    // real soroban. Lifting settles it at the nearer end. A short touch toggles it.
    function bindBead(g, r, kind, i) {
      let d = null;
      g.addEventListener('pointerdown', e => {
        if (locked || d) return;
        e.preventDefault();
        const d0 = digits[r];
        const b = bounds(kind, i);
        d = { id: e.pointerId, y0: e.clientY, d0, base: isActive(d0, kind, i) ? b.on : b.off, moved: false };
        g.setPointerCapture(e.pointerId);
        g.classList.add('drag');
      });
      g.addEventListener('pointermove', e => {
        if (!d || e.pointerId !== d.id) return;
        const dy = e.clientY - d.y0;
        if (Math.abs(dy) > TAP_PX) d.moved = true;
        if (!d.moved) return;
        const s = drag(d.d0, kind, i, d.base + dy / scale());
        if (s.digit !== digits[r]) { digits[r] = s.digit; layout(g); }
        place(g, centerX(r), s.y, s.toward);
      });
      const end = (e, cancelled) => {
        if (!d || e.pointerId !== d.id) return;
        const { d0, moved } = d;
        d = null;
        g.classList.remove('drag');
        if (cancelled) digits[r] = d0;
        else if (!moved) digits[r] = tap(d0, kind, i);
        layout();
        if (!cancelled && digits[r] !== d0 && opts.onChange) opts.onChange(digits.slice());
      };
      g.addEventListener('pointerup', e => end(e, false));
      g.addEventListener('pointercancel', e => end(e, true));
    }
    refs.forEach((ref, r) => {
      bindBead(ref.heaven, r, 'heaven', 0);
      ref.earth.forEach((g, i) => bindBead(g, r, 'earth', i));
    });

    host.replaceChildren(svg);
    layout();

    return {
      el: svg,
      get digits() { return digits.slice(); },
      get value() { return toValue(digits); },
      // Programmatic changes never fire onChange.
      set(ds) { digits.splice(0, rods, ...ds); layout(); },
      setValue(n) { this.set(toDigits(n, rods)); },
      lock(v) { locked = v; },
      // Outline where the beads should be for `target` digits, or clear with null.
      ghost(target) {
        board.querySelectorAll('.ghost').forEach(n => n.remove());
        if (!target) return;
        target.forEach((d, r) => {
          const spots = [];
          if (d >= 5) spots.push(heavenY(true));
          for (let i = 0; i < d % 5; i++) spots.push(earthY(i, true));
          spots.forEach(y => el('ellipse', { class: 'ghost', cx: centerX(r), cy: y + G.bh / 2, rx: G.bw / 2, ry: G.bh / 2 }, board));
        });
      },
    };
  }

  return { beadsFor, digitFrom, isActive, move, tap, toValue, toDigits, bounds, drag, create };
});

</script>
<script>
// Lesson data for Modules 1 and 2. Each lesson declares how to generate its items.
//
// Item shapes (all spoken via `say`; the child never has to read):
//   set  : { kind, rods, show, badge?, hint?, start[], target[], answer, say }  child moves the beads to `target`
//   read : { kind, rods, target[], answer, choices[3], say }                    child picks the number shown
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.Lessons = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ---------- small helpers ----------
  function mulberry32(seed) {
    return function () {
      seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const int = (rng, lo, hi) => lo + Math.floor(rng() * (hi - lo + 1));
  function shuffle(rng, a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = int(rng, 0, i);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  const range = (lo, hi, step = 1) => { const r = []; for (let v = lo; v <= hi; v += step) r.push(v); return r; };
  // n values drawn evenly from a pool of unique values, never the same twice in a row.
  function balanced(rng, pool, n) {
    const out = [];
    while (out.length < n) {
      const round = shuffle(rng, pool);
      if (out.length && pool.length > 1 && round[0] === out[out.length - 1]) round.push(round.shift());
      out.push(...round);
    }
    return out.slice(0, n);
  }
  const digitsOf = (n, rods) => String(n).padStart(rods, '0').split('').map(Number);

  // ---------- item builders ----------
  const setItem = (v, rods, extra = {}) => ({
    kind: 'set', rods, show: v, start: Array(rods).fill(0), target: digitsOf(v, rods), answer: v,
    say: `Show ${v} on your abacus. Then show it here.`,
    ...extra,
  });
  const readItem = (v, rods, choices) => ({
    kind: 'read', rods, target: digitsOf(v, rods), answer: v, choices, say: 'What number do you see?',
  });

  // Wrong answers a child is likely to pick.
  function digitChoices(rng, d) {
    const near = [d + 1, d - 1, d < 5 ? d + 5 : d - 5].filter(x => x >= 0 && x <= 9);
    return shuffle(rng, [d, ...shuffle(rng, near).slice(0, 2)]);
  }
  function numberChoices(rng, v) {
    const swap = (v % 10) * 10 + Math.floor(v / 10); // digits reversed: the classic place-value mix-up
    const near = [v + 1, v - 1, v + 10, v - 10].filter(x => x >= 10 && x <= 99);
    const wrong = swap !== v && swap >= 10 ? [swap] : [];
    for (const x of shuffle(rng, near)) if (wrong.length < 2 && !wrong.includes(x)) wrong.push(x);
    return shuffle(rng, [v, ...wrong]);
  }

  // ---------- curriculum ----------
  const MODULES = [
    { id: 1, title: 'Meet the soroban' },
    { id: 2, title: 'Tens and ones' },
  ];

  const LESSONS = [
    {
      id: '1.1', module: 1, icon: '👆', title: 'Push to the bar', rods: 1, count: 10, mastery: 9,
      intro: 'Hi! I am Capy. This is a soroban. Beads count when they touch the bar in the middle.',
      gen: rng => balanced(rng, [1, 5], 10).map((v, i) => setItem(v, 1, {
        hint: i < 3,
        say: v === 1 ? 'Push one bottom bead up to the bar.' : 'Push the top bead down to the bar.',
      })),
    },
    {
      id: '1.2', module: 1, icon: '🌱', title: 'Bottom beads, 0 to 4', rods: 1, count: 10, mastery: 9,
      intro: 'Push beads up to the bar to count them. Let us try the bottom beads.',
      // Zero means clearing: start with beads at the bar and push them all away.
      gen: rng => balanced(rng, range(0, 4), 10).map(v => setItem(v, 1, v === 0
        ? { start: [int(rng, 1, 4)], say: 'Clear the beads. Push every bead away from the bar.' }
        : {})),
    },
    {
      id: '1.3', module: 1, icon: '🍊', title: 'The top bead is five', rods: 1, count: 10, mastery: 9,
      intro: 'The top bead is worth five! Push it down to the bar.',
      gen: rng => balanced(rng, range(5, 9), 10).map(v => setItem(v, 1)),
    },
    {
      id: '1.4', module: 1, icon: '👀', title: 'Read the beads', rods: 1, count: 10, mastery: 9,
      intro: 'Now you read the beads. Which number is it?',
      gen: rng => balanced(rng, range(0, 9), 10).map(v => readItem(v, 1, digitChoices(rng, v))),
    },
    {
      id: '2.1', module: 2, icon: '🔟', title: 'Tens', rods: 2, count: 10, mastery: 8,
      intro: 'Two rods! The left rod is tens. The right rod is ones.',
      gen: rng => balanced(rng, range(10, 90, 10), 10).map(v =>
        setItem(v, 2, { say: `Show ${v}. Tens go on the left rod.` })),
    },
    {
      id: '2.2', module: 2, icon: '🧩', title: 'Tens and ones together', rods: 2, count: 10, mastery: 8,
      intro: 'Tens and ones together! Set the left rod, then the right rod.',
      gen: rng => {
        // Four numbers that need the top bead on both rods, six others.
        const both = range(5, 9).flatMap(t => range(5, 9).map(o => t * 10 + o));
        const heavy = shuffle(rng, both).slice(0, 4);
        const rest = range(11, 99).filter(v => v % 10 && !heavy.includes(v));

  let streak = 0;

  // ---------- friends and themes ----------
  const themeFor = moduleId => Themes.get(Themes.forModule(moduleId));
  function applyTheme(t) {
    const st = document.documentElement.style;
    Object.entries(Themes.vars(t)).forEach(([k, v]) => st.setProperty(k, v));
  }
  let theme = themeFor(1);
  const capy = (mood = '') => Themes.svg(theme.id, mood);
  const setMood = (mood) => { const c = app.querySelector('.coach .capy'); if (c) c.setAttribute('class', `capy ${mood}`); };

  // ---------- home ----------
  const stars = n => '⭐'.repeat(n) + '☆'.repeat(3 - n);
  function home() {
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    const nextId = ORDER.find(id => !(progress.lessons[id] && progress.lessons[id].passed));
    theme = themeFor(nextId ? byId[nextId].module : MODULES[MODULES.length - 1].id);
    applyTheme(theme);
    app.innerHTML = `
      <section class="home">
        <div class="hero">${capy('')}<div><h1>Soroban Friends</h1><p>${theme.name} says: pick a game!</p></div></div>
        ${MODULES.map(m => `
          <div class="module" style="${Themes.css(themeFor(m.id))}"><h2><span class="num">${m.id}</span>${m.title}</h2>
          <div class="path">${LESSONS.filter(l => l.module === m.id).map(l => {
            const ok = Runner.unlocked(progress, ORDER, l.id);
            const st = (progress.lessons[l.id] || {}).stars || 0;
            return `<button class="card ${l.id === nextId ? 'next' : ''}" data-id="${l.id}" ${ok ? '' : 'disabled'} aria-label="${l.title}${ok ? '' : ', locked'}">
              <span class="icon">${ok ? l.icon : '🔒'}</span><span class="name">${l.title}</span><span class="stars">${ok ? stars(st) : ''}</span></button>`;
          }).join('')}</div></div>`).join('')}
      </section>
      <button class="gear" id="gear" aria-label="Parent area. Press and hold.">⚙️</button>`;
    app.querySelectorAll('.card').forEach(b => b.addEventListener('click', () => play(b.dataset.id)));
    holdToOpen(document.getElementById('gear'), () => openParent());
  }

  // ---------- lesson ----------
  let session = null, sb = null, locked = false, current = null;

  function play(id) {
    const lesson = byId[id];
    theme = themeFor(lesson.module);
    applyTheme(theme);
    session = Runner.start(lesson, mulberry32((Date.now() ^ (Math.random() * 1e9)) >>> 0));
    streak = 0;
    app.innerHTML = `
      <section class="lesson">
        <div class="top">
          <button class="round" id="back" aria-label="Back">‹</button>
          <div class="dots" id="dots"></div>
          <button class="round" id="again" aria-label="Say it again">🔊</button>
        </div>
        <div class="stage">
          <div class="coach">${capy('')}<div class="bubble" id="bubble"></div></div>
          <div class="work"><div class="board" id="board"></div><div class="actions" id="actions"></div></div>
        </div>
      </section>
      <button class="gear" id="gear" aria-label="Parent area. Press and hold.">⚙️</button>`;
    document.getElementById('back').addEventListener('click', home);
    document.getElementById('again').addEventListener('click', () => current && say(current.say));
    holdToOpen(document.getElementById('gear'), () => openParent());
    introPending = lesson.intro;
    item();
  }

  let itemTimer = null, idleTimer = null, introPending = '';
  function item() {
    clearTimeout(itemTimer);
    clearTimeout(idleTimer);
    const it = Runner.current(session);
    if (!it) return finish();
    current = it; locked = false;
    renderDots();
    setMood('');
    const lesson = session.lesson;
    const board = document.getElementById('board'), actions = document.getElementById('actions'), bubble = document.getElementById('bubble');
    if (!board) return;
    const labels = it.rods === 2 ? ['10', '1'] : null;
    bubble.className = 'bubble';
    bubble.innerHTML = '';
    actions.innerHTML = '';

    if (it.kind === 'set') {
      bubble.innerHTML = `${it.show}${it.badge ? `<span class="delta">${it.badge}</span>` : ''}`;
      // The board starts fresh for every problem, so nothing carries over from the last one.
      sb = Soroban.create(board, { rods: it.rods, labels, onChange: ds => onBeads(it, ds) });
      sb.set(it.start);
      if (it.hint) sb.ghost(it.target);
    } else {
      bubble.className = 'bubble sm'; bubble.textContent = '?';
      sb = Soroban.create(board, { rods: it.rods, labels });
      sb.set(it.target); sb.lock(true);
      actions.innerHTML = it.choices.map(c => `<button class="choice" data-v="${c}">${c}</button>`).join('');
      actions.querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => {
        if (locked) return;
        const ok = Number(b.dataset.v) === it.answer;
        if (ok) b.classList.add('right'); else b.classList.add('gone');
        answer(ok);
      }));
    }
    say(introPending ? `${introPending} ${it.say}` : it.say);
    introPending = '';
  }

  function renderDots() {
    const d = document.getElementById('dots');
    if (!d) return;
    d.innerHTML = session.queue.map((_, i) => `<i class="${i < session.pos ? 'done' : i === session.pos ? 'now' : ''}"></i>`).join('');
  }

  function hint(it) {
    if (it.kind === 'set') sb.ghost(it.target);
    else app.querySelectorAll('.choice').forEach(b => { if (Number(b.dataset.v) === it.answer) b.classList.add('pulse'); });
  }

  // Beads settle when a finger lifts. A match is right straight away. Anything else is
  // given a moment, so a move that is still in progress is never counted as a mistake.
  const SETTLE_MS = 2200;
  function onBeads(it, digits) {
    if (locked || it !== current) return;
    clearTimeout(idleTimer);
    if (digits.join('') === it.target.join('')) return answer(true);
    idleTimer = setTimeout(() => { if (!locked && it === current) answer(false); }, SETTLE_MS);
  }

  function answer(ok) {
    if (locked) return;
    clearTimeout(idleTimer);
    const it = current;
    const first = session.attempts === 0 && !it.retry;   // read before submit() resets it
    const r = Runner.submit(session, ok);
    if (r.outcome === 'correct') {
      locked = true; sb.lock(true);
      streak = first ? streak + 1 : 0;
      setMood('happy'); chime(true);
      say(phrases.praise({ first, streak, n: typeof it.answer === 'number' ? it.answer : undefined }));
      itemTimer = setTimeout(() => (r.done ? finish() : item()), 1500);
    } else {
      streak = 0;
      setMood('oops'); chime(false);
      say(r.outcome === 'hint' ? phrases.help() : phrases.oops());
      if (r.outcome === 'hint') hint(it);
      setTimeout(() => setMood(''), 900);
    }
  }

  function finish() {
    const res = Runner.result(session);
    Runner.record(progress, session.lesson.id, res, Date.now());
    persist();
    const next = ORDER[ORDER.indexOf(session.lesson.id) + 1];
    app.innerHTML = `
      <section class="result">
        ${capy(res.passed ? 'happy' : '')}
        <h1>${res.passed ? 'Amazing!' : 'Good practice!'}</h1>
        <div class="stars" aria-label="${res.stars} stars">${stars(res.stars)}</div>
        <div class="row">
          <button class="big alt" id="r-again" aria-label="Play again">↻</button>
          ${res.passed && next ? '<button class="big" id="r-next" aria-label="Next game">›</button>' : ''}
          <button class="big alt" id="r-home" aria-label="Home">⌂</button>
        </div>
      </section>`;
    chime(res.passed);
    say(phrases.done(res.passed));
    document.getElementById('r-again').addEventListener('click', () => play(session.lesson.id));
    document.getElementById('r-home').addEventListener('click', home);
    const n = document.getElementById('r-next');
    if (n) n.addEventListener('click', () => play(next));
  }

  // ---------- parent area ----------
  function holdToOpen(btn, fn) {
    let t = null;
    const stop = () => { clearTimeout(t); t = null; };
    btn.addEventListener('pointerdown', () => { stop(); t = setTimeout(fn, 1200); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
  }

  function openParent() {
    const inLesson = session && document.querySelector('.lesson');
    const rows = LESSONS.map(l => {
      const p = progress.lessons[l.id];
      return `<tr><td>${l.id} ${l.title}</td><td>${p ? p.plays : 0}</td><td>${p ? `${p.best}/${l.count}` : '-'}</td><td>${p && p.passed ? 'passed' : '-'}</td></tr>`;
    }).join('');
    parentEl.hidden = false;
    const ranked = Talk.rank(allVoices());
    const current_ = voice();
    const voiceRow = ranked.length
      ? `<div class="voice"><label for="p-voice">Voice</label>
          <select id="p-voice">${ranked.map(v => `<option value="${v.name.replace(/"/g, '&quot;')}" ${current_ && v.name === current_.name ? 'selected' : ''}>${v.name} (${v.lang})</option>`).join('')}</select>
          <button class="pbtn" id="p-hear">Hear it</button></div>
         <p class="tip">For a more natural voice, install an Enhanced or Premium one: Settings > Accessibility > Spoken Content > Voices.</p>`
      : '<p class="tip">No English voices were found on this device.</p>';
    parentEl.innerHTML = `
      <div class="panel" role="dialog" aria-label="Parent area">
        <h2>Parent area</h2>
        <p>Best score counts only first-try answers. A lesson opens once the one before it is passed.</p>
        <table><tr><th>Game</th><th>Plays</th><th>Best</th><th></th></tr>${rows}</table>
        ${voiceRow}
        <div class="row">
          ${inLesson && current ? '<button class="pbtn go" id="p-show">Show answer</button><button class="pbtn" id="p-skip">Skip this one</button>' : ''}
          <button class="pbtn" id="p-sound">Sound: ${progress.sound ? 'on' : 'off'}</button>
          <button class="pbtn" id="p-unlock">Unlock all: ${progress.unlockAll ? 'on' : 'off'}</button>
          <button class="pbtn danger" id="p-reset">Reset progress</button>
          <button class="pbtn go" id="p-close">Close</button>
        </div>
      </div>`;
    const $ = id => document.getElementById(id);
    const close = () => { parentEl.hidden = true; parentEl.innerHTML = ''; };
    $('p-close').addEventListener('click', close);
    if ($('p-voice')) {
      $('p-voice').addEventListener('change', e => { progress.voice = e.target.value; persist(); say(phrases.praise({ first: true })); });
      $('p-hear').addEventListener('click', () => say(phrases.praise({ first: true })));
    }
    $('p-sound').addEventListener('click', () => { progress.sound = !progress.sound; persist(); openParent(); });
    $('p-unlock').addEventListener('click', () => { progress.unlockAll = !progress.unlockAll; persist(); openParent(); });
    // Two taps, not a browser dialog: browsers and Home Screen apps can silently block those.
    let armed = null;
    $('p-reset').addEventListener('click', e => {
      const b = e.currentTarget;
      if (!armed) {
        b.textContent = 'Tap again to erase everything';
        b.classList.add('armed');
        armed = setTimeout(() => { armed = null; b.textContent = 'Reset progress'; b.classList.remove('armed'); }, 4000);
        return;
      }
      clearTimeout(armed);
      Runner.wipe(progress);
      persist();
      session = null; current = null;
      close();
      home();
    });
    if ($('p-show')) $('p-show').addEventListener('click', () => {
      hint(current);   // outline only: the child still makes the move himself
      close();
    });
    if ($('p-skip')) $('p-skip').addEventListener('click', () => {
      // Counts as a miss so the score stays honest, then moves on.
      Runner.submit(session, false); Runner.submit(session, false);
      session.pos++; session.attempts = 0; close(); item();
    });
    parentEl.onclick = e => { if (e.target === parentEl) close(); };
  }

  home();
})();

</script>
</body>
</html>
